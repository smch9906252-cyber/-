<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>전사의 여정</title>
<!-- 브라우저에서 바로 여는 시작 파일. tools/serve.py로 띄우면 http://localhost:8000 에서 열립니다.
     <script> 목록을 바꾸면 artifact.html도 똑같이 바꿔 주세요. -->
<style>
  :root { color-scheme: dark; --bg: #000; --fg: #fff; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  #hud { cursor: crosshair; }
  #error {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    padding: 24px; color: var(--fg); text-align: center; font: 18px "Malgun Gothic", sans-serif;
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<canvas id="hud"></canvas>
<div id="error"></div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/math3d.js"></script>
<script src="js/input.js"></script>
<script src="js/gl.js"></script>
<script src="js/shaders.js"></script>
<script src="js/art.js"></script>
<script src="js/weapons.js"></script>
<script src="js/levels.js"></script>
<script src="js/map.js"></script>
<script src="js/camera.js"></script>
<script src="js/player.js"></script>
<script src="js/character.js"></script>
<script src="js/cape.js"></script>
<script src="js/particles.js"></script>
<script src="js/enemies.js"></script>
<script src="js/skills.js"></script>
<script src="js/post.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
